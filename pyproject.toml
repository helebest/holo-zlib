[project]
name = "holo-zlib"
version = "0.2.0"
description = "Z-Library search & download skill for Claude Code"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
holo-zlib-validate = "holo_zlib.validate:main"
holo-zlib-package = "holo_zlib.package:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holo_zlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
